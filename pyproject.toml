# The floor is 1.27.0: that is the first hatchling release with PEP 639 support,
# which the `license` expression and `license-files` below depend on (core
# metadata 2.4+). Older backends would silently ignore the expression.
[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "porter-workflow"
# Single source of truth: `porter.__version__`. pyproject is the only other
# place a version could live, so it does not live here. The release workflow
# still asserts the git tag equals `porter.__version__` before publishing.
dynamic = ["version"]
description = "Automated video localization, multi-engine ASR, subtitle translation, and dual-version FFmpeg hardsub pipeline for AI agents, CLI, and MCP hosts."
readme = "README.md"
# PEP 639 license expression. The legacy `License ::` classifier is deliberately
# absent: it is deprecated by the same PEP, and shipping both is contradictory.
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.11"
authors = [{ name = "RoL1n_SrP" }]
keywords = [
    "youtube",
    "video-localization",
    "subtitles",
    "asr",
    "translation",
    "ffmpeg",
    "hardsub",
    "agent-skill",
    "mcp",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video",
]

dependencies = [
    "yt-dlp[default]>=2025.11.12",
    "requests>=2.31",
    "pydantic>=2.0",
    "platformdirs>=4.0",
]

[project.optional-dependencies]
llm = ["openai>=1.0", "json-repair>=0.30"]
stt = ["SpeechRecognition>=3.10"]
#: Local speech recognition: no key, no network, no third-party service. MIT and
#: CTranslate2-backed, so unlike openai-whisper it does not drag in PyTorch.
asr-local = ["faster-whisper>=1.0"]
images = ["pillow>=10.0"]
mcp = ["fastmcp>=2.11"]
all = ["porter-workflow[llm,stt,asr-local,images,mcp]"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "import-linter>=2.0",
]

[project.scripts]
porter = "porter_cli.__main__:main"
porter-mcp = "porter_mcp.server:main"

[project.urls]
Homepage = "https://github.com/RolinShmily/porter-workflow"
Repository = "https://github.com/RolinShmily/porter-workflow"
Issues = "https://github.com/RolinShmily/porter-workflow/issues"
Documentation = "https://github.com/RolinShmily/porter-workflow/tree/main/docs"
Changelog = "https://github.com/RolinShmily/porter-workflow/blob/main/CHANGELOG.md"

[tool.hatch.version]
# Keep `porter.__version__` authoritative; see `dynamic` above.
path = "src/porter/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/porter", "src/porter_cli", "src/porter_mcp"]

# The sdist is the source of record, so it carries the license and the
# third-party notices that `license-files` already puts into the wheel.
#
# `/tests` is deliberately absent: tests are a development and CI artifact, and
# nobody who installs the package runs them. Shipping them only widens the
# sdist and invites confusion about what is supported. They remain in the git
# repository, which is where CI and contributors get them from.
[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/skills",
    "/README.md",
    "/LICENSE",
    "/THIRD_PARTY_NOTICES.md",
    "/CHANGELOG.md",
]

# ---------------------------------------------------------------------------
# Lint — T20 is a hard requirement: the engine must never print(), because
# stdout is the JSON-RPC channel for the MCP frontend.
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
# Must track `requires-python`: ruff uses this to decide which imports are stdlib
# and which `UP` rewrites apply. Left at py310 it classified `tomllib` as
# third-party and flagged the sorted import block as unsorted.
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "BLE", "A", "C4", "SIM", "T20", "RUF", "S"]
# E501 is the formatter's business.
#
# UP042 wants the six ``(str, Enum)`` classes to become ``StrEnum``, which the 3.11
# floor makes available. Not done here on purpose: the two differ in what ``str()``,
# f-strings and ``format()`` produce -- ``"Severity.BLOCKER"`` against ``"blocker"``,
# measured -- so it is a user-visible change, not a modernisation. Nothing needs it
# today: every read site uses ``.value`` (JSON is identical either way). Worth doing
# as its own change, with the output compared before and after.
ignore = ["E501", "UP042"]

[tool.ruff.lint.per-file-ignores]
"src/porter_cli/**" = ["T20"]
# assert IS the test mechanism, and tests spawn ffmpeg to build fixtures on
# purpose. Both are meaningful signals in src/, so they stay enabled there.
"tests/**" = ["T20", "S101", "S603", "S607"]
# Control-flow signal and guard exception, not faults. Renaming them to satisfy
# N818 would obscure their meaning and break the documented public API.
"src/porter/errors.py" = ["N818"]
"src/porter_mcp/stdout_guard.py" = ["N818"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
# CI type-checks on Linux, and mypy evaluates one platform at a time: without this
# the local gate on a Windows machine checks win32 semantics and CI checks POSIX
# ones, so `ctypes.WinDLL` (Windows-only in typeshed) passed locally while the
# gate went red. Pinning the platform makes `uv run mypy src` mean what CI means.
platform = "linux"
files = ["src"]
mypy_path = "src"
explicit_package_bases = true
namespace_packages = true

# ---------------------------------------------------------------------------
# Dependencies whose *stubs* require a newer Python than we support.
#
# ``python_version = "3.11"`` is the floor we promise, so mypy parses with 3.11
# syntax rules. ``numpy``'s ``__init__.pyi`` uses PEP 695 ``type`` statements
# (3.12+), and mypy aborts the entire run on it rather than reporting one module:
#
#     numpy/__init__.pyi:737: error: Type statement is only supported in
#     Python 3.12 and greater  [syntax]
#     Found 1 error in 1 file (errors prevented further checking)
#
# numpy is not ours and is not imported by any of our code -- it arrives
# transitively (faster-whisper -> ctranslate2), and the OpenAI SDK then reaches
# it through ``openai/_extras/numpy_proxy.py``, its optional-dependency proxy for
# a numpy feature we do not use.
#
# Only ``follow_imports = "skip"`` on the *importer* actually prevents this: mypy
# still parses a module marked ``skip`` when it is reached directly, and neither
# ``ignore_errors`` nor ``follow_imports`` on ``numpy`` itself suppresses a syntax
# error. Skipping ``openai._extras.*`` — the package whose whole job is to import
# optional third-party libraries — keeps numpy out of the graph without
# touching openai's own types or raising the floor.
#
# Verified 2026-09-23 against mypy 2.3.1: without this block the gate is red, with
# it ``Success: no issues found in 96 source files``.
# ---------------------------------------------------------------------------
[[tool.mypy.overrides]]
module = ["openai._extras.*"]
follow_imports = "skip"

# ---------------------------------------------------------------------------
# Layering guard — the engine must never depend on a frontend.
# ---------------------------------------------------------------------------
[tool.importlinter]
root_package = "porter"
# The forbidden frontends live outside root_package, so they must be treated as
# external packages for the contract below to see them.
include_external_packages = true

[[tool.importlinter.contracts]]
name = "engine must not import frontends"
type = "forbidden"
source_modules = ["porter"]
forbidden_modules = ["porter_cli", "porter_mcp"]

[[tool.importlinter.contracts]]
name = "engine layers"
type = "layers"
# Ordered top -> bottom. A layer may import anything below it, never above it or
# a sibling inside the same layer. The order encodes the real dependency graph:
# pipeline -> backends -> media -> ports/context -> models -> config -> events
# -> leaf utilities.
layers = [
    # plan observes the pipeline, the platform layer and both chains, and reports
    # on them. It builds one via Pipeline.default, so it sits *above* the pipeline
    # in the import sense -- a layer may import what is below it, never above.
    # Like porter.jobs, it was outside this contract at first, which meant the
    # module whose whole job is to describe the pipeline accurately could have
    # imported anything at all.
    "porter.plan",
    "porter.pipeline",
    # doctor is a cross-cutting service: it observes the media layer, the
    # platform layer and the ASR/translation chains, and is consumed by the
    # frontends. It sits below the pipeline (the pipeline must not run doctor
    # unconditionally) and above the backends it reports on.
    "porter.doctor",
    "porter.asr | porter.translate | porter.platforms",
    "porter.media | porter.subtitles",
    "porter.ports",
    # Job tracking is a frontend-facing service that needs only models, context
    # and events. It sat outside this contract entirely, which meant the one
    # module both frontends depend on was the one module nothing constrained:
    # it could have imported the pipeline or the media layer and no gate would
    # have said a word. Placed at its true dependency depth instead.
    "porter.jobs",
    "porter.context",
    "porter.models",
    "porter.config",
    "porter.events",
    "porter.logging | porter.errors | porter.utils",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
markers = [
    "slow: end-to-end tests that shell out to real ffmpeg; deterministic, no network",
    "network: tests that reach the public internet; opt-in, and they skip when offline",
]
