name: release

# Creates a GitHub Release (`porter-workflow v<version>`) for a given tag,
# using the matching version section from the root `CHANGELOG.md`.
#
# Invoked automatically by `.github/workflows/publish.yml` after PyPI upload
# succeeds, or run manually via `workflow_dispatch` to create/backfill a
# GitHub Release without touching PyPI.

on:
  workflow_call:
    inputs:
      tag:
        description: "Git tag to release (e.g. v0.4.2)"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag to release (e.g. v0.4.2)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  github-release:
    name: create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Extract release notes from the root changelog
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          version="${RELEASE_TAG#v}"
          version="${version#pypi-v}"
          python3 - "$version" <<'PY' > release_notes.md
          import pathlib
          import re
          import sys

          version = sys.argv[1]

          root_path = pathlib.Path("CHANGELOG.md")
          if root_path.is_file():
              text = root_path.read_text(encoding="utf-8")
              pattern = re.compile(r"^## \[([^\]]+)\][^\n]*\n(.*?)(?=^## \[|\Z)", re.S | re.M)
              for match in pattern.finditer(text):
                  if match.group(1).strip() == version:
                      body = match.group(2).strip()
                      if body:
                          print(body)
                      break
          PY

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          version="${RELEASE_TAG#v}"
          version="${version#pypi-v}"
          title="porter-workflow v${version}"
          if [ -s release_notes.md ]; then
            gh release create "$RELEASE_TAG" --title "$title" --notes-file release_notes.md
          else
            gh release create "$RELEASE_TAG" --title "$title" --generate-notes
          fi
