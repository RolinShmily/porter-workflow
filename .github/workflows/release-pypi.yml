name: release-pypi

# Publishes `porter-workflow` to PyPI on a `v*` version tag and creates the
# matching GitHub Release (`porter-workflow v<version>`) aggregating root
# `CHANGELOG.md` with any Skill changelog entries added since the previous tag.
#
# Authentication is PyPI Trusted Publishing (OIDC), not an API token.
# One-time setup on PyPI -> Publishing -> Trusted Publishers:
#   Owner:            RolinShmily
#   Repository:       porter-workflow
#   Workflow name:    release-pypi.yml
#   Environment:      pypi

on:
  push:
    tags:
      - "v*"
  # Lets a release be retried after a PyPI outage without re-tagging.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    name: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -1

      - name: Install the locked environment
        run: uv sync --extra web --extra dev --locked

      - name: ruff
        run: uv run ruff check src tests skills

      - name: mypy
        run: uv run mypy src

      - name: import-linter
        run: uv run lint-imports

      - name: pytest
        run: uv run pytest -m "not network"

      - name: The tag must match porter.__version__
        if: github.ref_type == 'tag'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(uv run python -c 'import porter; print(porter.__version__)')"
          if [ "$tag" != "$version" ]; then
            echo "tag v$tag does not match porter.__version__ = $version" >&2
            exit 1
          fi
          echo "tag and version agree: $version"

  build:
    name: build
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Build sdist + wheel
        run: uv build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/porter-workflow
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  github-release:
    name: create GitHub Release
    needs: publish
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aggregate release notes from root and skill changelogs
        run: |
          version="${GITHUB_REF_NAME#v}"
          prev_tag="$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" --match 'v*' --match 'pypi-v*' 2>/dev/null || true)"
          python3 - "$version" "$prev_tag" <<'PY' > release_notes.md
          import pathlib
          import re
          import subprocess
          import sys

          version = sys.argv[1]
          prev_tag = sys.argv[2]

          def parse_sections(text: str) -> dict[str, str]:
              sections: dict[str, str] = {}
              pattern = re.compile(r"^## \[([^\]]+)\][^\n]*\n(.*?)(?=^## \[|\Z)", re.S | re.M)
              for m in pattern.finditer(text):
                  key = m.group(1).strip()
                  body = m.group(2).strip()
                  if key.lower() != "unreleased" and body:
                      sections[key] = body
              return sections

          parts: list[str] = []

          root_path = pathlib.Path("CHANGELOG.md")
          if root_path.is_file():
              root_sections = parse_sections(root_path.read_text(encoding="utf-8"))
              if version in root_sections:
                  parts.append(root_sections[version])

          skill_rel = "skills/porter-workflow/CHANGELOG.md"
          skill_path = pathlib.Path(skill_rel)
          if skill_path.is_file():
              cur_skill = parse_sections(skill_path.read_text(encoding="utf-8"))
              prev_skill: dict[str, str] = {}
              if prev_tag:
                  proc = subprocess.run(
                      ["git", "show", f"{prev_tag}:{skill_rel}"],
                      capture_output=True,
                      text=True,
                      encoding="utf-8",
                      check=False,
                  )
                  if proc.returncode == 0:
                      prev_skill = parse_sections(proc.stdout)
              skill_blocks = [
                  f"### Skill v{ver}\n\n{body}"
                  for ver, body in cur_skill.items()
                  if prev_skill.get(ver) != body
              ]
              if skill_blocks:
                  parts.append("## Agent Skill (`skills/porter-workflow`)\n\n" + "\n\n".join(skill_blocks))

          if parts:
              print("\n\n---\n\n".join(parts))
          PY

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          title="porter-workflow v${version}"
          if [ -s release_notes.md ]; then
            gh release create "$GITHUB_REF_NAME" --title "$title" --notes-file release_notes.md
          else
            gh release create "$GITHUB_REF_NAME" --title "$title" --generate-notes
          fi
