name: Feature request
description: Suggest a capability or an improvement
title: "[feat] "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Before proposing a new dependency or a new backend, please read the
        licence rules in
        [CONTRIBUTING.md](https://github.com/RolinShmily/porter-workflow/blob/main/CONTRIBUTING.md#licence-rules).
        Porter is MIT; copyleft components stay behind a subprocess boundary.

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Engine (pipeline, media, subtitles)
        - New platform
        - ASR backend
        - Translation backend
        - CLI
        - MCP server
        - Agent Skill
        - Documentation
        - Packaging / release
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: >
        Describe the situation, not the solution. What do you do today, and what
        is painful about it?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
      description: Including existing tools or workarounds, and why they fall short.
    validations:
      required: false

  - type: textarea
    id: scope
    attributes:
      label: Does this need a new dependency or platform access?
      description: >
        Name any package, API, key or system binary it would require, and its
        licence if you know it.
    validations:
      required: false

  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmations
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
        - label: I am willing to work on this myself, if the design is agreed first.
          required: false
